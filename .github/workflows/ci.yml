name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: myuser      
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: 'maven' 

      - name: Make Maven wrapper executable
        run: chmod +x ./backend/mvnw

      - name: Backend Tests & Build
        env:
          
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: myuser
          SPRING_DATASOURCE_PASSWORD: password
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop 
        run: |
          cd backend
          
          ./mvnw clean verify 

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci 

      - name: Frontend Lint & Build Check
        run: |
          cd frontend
          
          npm run build 

      - name: Frontend Tests & Generate Report
        run: |
          cd frontend
          
          npm install --no-save jest-html-reporter 
               
          echo '{ "pageTitle": "Frontend Test Report", "outputPath": "test-report.html" }' > jesthtmlreporter.config.json     
          
          npm test -- --coverage --reporters=default --reporters=jest-html-reporter

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }} 
          files: |
            ./frontend/coverage/lcov.info
            ./backend/target/site/jacoco/jacoco.xml

      - name: Upload Frontend Test Report Artifact
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: frontend/test-report.html